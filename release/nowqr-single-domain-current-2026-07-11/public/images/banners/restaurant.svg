<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="cutleryShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="240" height="340" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle culinary circular pattern -->
  <circle cx="120" cy="170" r="110" fill="none" stroke="#ffedd5" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.15"/>

  <!-- Plate Shadow and Body -->
  <circle cx="120" cy="170" r="88" fill="#ffffff" filter="url(#plateShadow)"/>
  <circle cx="120" cy="170" r="76" fill="#fef3c7" opacity="0.3"/>
  <circle cx="120" cy="170" r="72" fill="#ffffff" stroke="#ffedd5" stroke-width="1"/>

  <!-- Gold/Orange Rim Highlight -->
  <circle cx="120" cy="170" r="86" fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.8"/>

  <!-- Left Fork -->
  <g transform="translate(14, 105)" filter="url(#cutleryShadow)">
    <path d="M 9,15 L 9,45 C 9,56 18,56 18,45 L 18,15 M 12,15 L 12,35 M 15,15 L 15,35" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 13.5,45 L 13.5,120" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- Right Knife -->
  <g transform="translate(202, 105)" filter="url(#cutleryShadow)">
    <path d="M 6,15 C 6,15 15,20 15,45 L 15,120 L 7,120 L 7,15" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Plate Center Ring (helps frame the QR card nicely) -->
  <circle cx="120" cy="170" r="54" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
</svg>
