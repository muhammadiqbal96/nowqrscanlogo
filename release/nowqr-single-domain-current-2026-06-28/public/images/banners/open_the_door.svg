<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="doorBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="doorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#022c22" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#doorBg)"/>

  <!-- Sun Rays through garden foliage -->
  <ellipse cx="240" cy="0" rx="180" ry="120" fill="#fef08a" opacity="0.1" filter="blur(20px)"/>

  <!-- Arched Doorway Frame (centered at 120, 170) -->
  <path d="M 50,270 L 50,150 A 70,70 0 0,1 190,150 L 190,270 Z" fill="#047857" filter="url(#doorShadow)"/>
  
  <!-- Inner Door arch cutout (holds QR code) -->
  <path d="M 58,270 L 58,154 A 62,62 0 0,1 182,154 L 182,270 Z" fill="#064e3b"/>

  <!-- Golden Arch Frame border line -->
  <path d="M 54,270 L 54,152 A 66,66 0 0,1 186,152 L 186,270" fill="none" stroke="url(#goldTrim)" stroke-width="3" filter="url(#doorShadow)"/>

  <!-- Left & Right Door Panels (open slightly inside the frame) -->
  <path d="M 58,270 L 58,154 A 62,62 0 0,1 120,154 L 120,270 Z" fill="none" stroke="#047857" stroke-width="2" opacity="0.5"/>
  <path d="M 120,270 L 120,154 A 62,62 0 0,1 182,154 L 182,270 Z" fill="none" stroke="#047857" stroke-width="2" opacity="0.5"/>

  <!-- Golden Door Knobs (Framing the bottom of the QR code area) -->
  <circle cx="114" cy="210" r="5" fill="url(#goldTrim)"/>
  <circle cx="126" cy="210" r="5" fill="url(#goldTrim)"/>
</svg>
