<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5e0c3" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="frameShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#78350f" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#warmBg)"/>

  <!-- Subtle grid wall texture -->
  <path d="M 0,80 L 240,80 M 0,160 L 240,160 M 0,240 L 240,240 M 80,0 L 80,340 M 160,0 L 160,340" stroke="#f5f5f4" stroke-width="1.5"/>

  <!-- Hanging Thread for Frame -->
  <path d="M 120,40 L 60,110 M 120,40 L 180,110" stroke="#78716c" stroke-width="1.5"/>
  <circle cx="120" cy="40" r="4" fill="#78716c"/>

  <!-- Polaroid-style Wooden Hanging Frame (centered around 120, 185) -->
  <rect x="52" y="102" width="136" height="166" rx="8" fill="#ffffff" filter="url(#frameShadow)"/>
  
  <!-- Outer border line -->
  <rect x="58" y="108" width="124" height="154" rx="4" fill="none" stroke="#e7e5e4" stroke-width="1"/>

  <!-- Photo Inner Cutout (perfect border to seat QR code) -->
  <rect x="64" y="114" width="112" height="112" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5"/>

  <!-- Heart/Star Pin icon on bottom margin of polaroid frame -->
  <path d="M 120,246 C 120,246 114,240 114,236 C 114,232 118,230 120,233 C 122,230 126,232 126,236 C 126,240 120,246 120,246 Z" fill="#ef4444" opacity="0.6"/>
</svg>
