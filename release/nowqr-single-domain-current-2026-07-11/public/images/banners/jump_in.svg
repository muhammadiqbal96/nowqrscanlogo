<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="skateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#skateBg)"/>

  <!-- Graffiti Splatter / Paint Drips in Background -->
  <path d="M 30,50 Q 50,30 90,45 Q 110,35 130,60 Q 170,40 210,70 L 190,120 Q 220,180 180,240 Q 150,290 80,270 Q 30,220 50,130 Z" fill="#ec4899" opacity="0.15"/>
  <path d="M 60,250 C 60,280 50,300 45,320" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Dynamic diagonal yellow stripes -->
  <line x1="-20" y1="80" x2="260" y2="220" stroke="#eab308" stroke-width="12" opacity="0.1"/>
  <line x1="-20" y1="120" x2="260" y2="260" stroke="#eab308" stroke-width="12" opacity="0.1"/>

  <!-- Circular Graffiti spray ring framing QR -->
  <circle cx="120" cy="170" r="82" fill="none" stroke="#eab308" stroke-width="5" stroke-dasharray="30 10 10 10" filter="url(#neon)"/>
  <circle cx="120" cy="170" r="76" fill="none" stroke="#ef4444" stroke-width="3" filter="url(#neon)"/>

  <!-- Stylized Skateboard crossing behind the frame diagonally -->
  <g transform="translate(120, 170) rotate(-35) translate(-120, -170)">
    <!-- Skateboard Deck -->
    <rect x="25" y="162" width="190" height="16" rx="8" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="55" cy="182" r="8" fill="#ef4444"/>
    <circle cx="185" cy="182" r="8" fill="#ef4444"/>
    <circle cx="55" cy="158" r="8" fill="#ef4444"/>
    <circle cx="185" cy="158" r="8" fill="#ef4444"/>
  </g>
</svg>
