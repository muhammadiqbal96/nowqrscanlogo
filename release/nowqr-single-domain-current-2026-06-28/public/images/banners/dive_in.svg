<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="poolBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="buoyStripes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="floatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background (Pool Water) -->
  <rect width="240" height="340" rx="24" fill="url(#poolBg)"/>

  <!-- Water Ripple Lines -->
  <path d="M -20,50 Q 40,30 100,50 T 220,50 T 260,30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <path d="M -20,110 Q 50,90 120,110 T 260,95" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.2"/>
  <path d="M -20,220 Q 30,240 90,220 T 210,220 T 260,200" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.25"/>
  <path d="M -20,290 Q 60,270 140,290 T 260,280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.25"/>

  <!-- Swimming Pool Float (Buoy Ring) -->
  <circle cx="120" cy="170" r="82" fill="#ffffff" filter="url(#floatShadow)"/>

  <!-- Red Buoy Stripes (Masked inside the ring) -->
  <!-- Top Stripe -->
  <path d="M 90,92 C 100,89 110,88 120,88 C 130,88 140,89 150,92 L 155,104 C 145,101 133,100 120,100 C 107,100 95,101 85,104 Z" fill="url(#buoyStripes)"/>
  <!-- Bottom Stripe -->
  <path d="M 90,248 C 100,251 110,252 120,252 C 130,252 140,251 150,248 L 155,236 C 145,239 133,240 120,240 C 107,240 95,239 85,236 Z" fill="url(#buoyStripes)"/>
  <!-- Left Stripe -->
  <path d="M 38,170 C 38,157 39,145 42,135 L 54,140 C 51,150 50,160 50,170 C 50,180 51,190 54,200 L 42,205 C 39,195 38,183 38,170 Z" fill="url(#buoyStripes)"/>
  <!-- Right Stripe -->
  <path d="M 202,170 C 202,157 201,145 198,135 L 186,140 C 189,150 190,160 190,170 C 190,180 189,190 186,200 L 198,205 C 201,195 202,183 202,170 Z" fill="url(#buoyStripes)"/>

  <!-- Float Inner Rim Shadow (helps separate float from white QR card) -->
  <circle cx="120" cy="170" r="50" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3"/>
</svg>
