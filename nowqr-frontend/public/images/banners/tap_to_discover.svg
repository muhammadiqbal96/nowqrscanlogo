<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="100%" stop-color="#180b30"/>
    </linearGradient>
    <filter id="neonBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#techBg)"/>

  <!-- Cybernetic Grid Backdrop -->
  <path d="M 0,170 L 240,170 M 120,0 L 120,340" stroke="#2e1065" stroke-width="1.5" opacity="0.6"/>
  <circle cx="120" cy="170" r="110" fill="none" stroke="#2e1065" stroke-width="1" opacity="0.4"/>
  <circle cx="120" cy="170" r="95" fill="none" stroke="#2e1065" stroke-width="1" opacity="0.4"/>

  <!-- Target Locks (Crosshairs at 4 corners of QR area) -->
  <path d="M 50,110 L 50,100 L 60,100" fill="none" stroke="#00f2ff" stroke-width="3" stroke-linecap="round" filter="url(#neonBlue)"/>
  <path d="M 190,110 L 190,100 L 180,100" fill="none" stroke="#00f2ff" stroke-width="3" stroke-linecap="round" filter="url(#neonBlue)"/>
  <path d="M 50,230 L 50,240 L 60,240" fill="none" stroke="#00f2ff" stroke-width="3" stroke-linecap="round" filter="url(#neonBlue)"/>
  <path d="M 190,230 L 190,240 L 180,240" fill="none" stroke="#00f2ff" stroke-width="3" stroke-linecap="round" filter="url(#neonBlue)"/>

  <!-- Holographic Scanning Ring -->
  <circle cx="120" cy="170" r="82" fill="none" stroke="#00f2ff" stroke-width="2" stroke-dasharray="25 15 5 15" filter="url(#neonBlue)"/>
  <circle cx="120" cy="170" r="76" fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.8" filter="url(#neonBlue)"/>

  <!-- Scanning Sweep (gradient sector representing radar sweep) -->
  <path d="M 120,170 L 120,94 A 76,76 0 0,1 185,130 Z" fill="#00f2ff" opacity="0.08"/>

  <!-- Core Frame -->
  <circle cx="120" cy="170" r="54" fill="none" stroke="#00f2ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
</svg>
