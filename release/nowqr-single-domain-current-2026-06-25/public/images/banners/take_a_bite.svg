<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="burgerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    
    <!-- Warm Fire Glow behind burger -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#18181b" stop-opacity="0"/>
    </radialGradient>

    <!-- Teeth bite mask to subtract from the burger group -->
    <mask id="biteMask">
      <rect width="240" height="340" fill="white"/>
      <!-- Bite bite circle cutouts on the right side of the burger -->
      <circle cx="186" cy="148" r="14" fill="black"/>
      <circle cx="194" cy="168" r="15" fill="black"/>
      <circle cx="186" cy="188" r="14" fill="black"/>
    </mask>

    <filter id="burgerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#burgerBg)"/>
  
  <!-- Backdrop Glow -->
  <circle cx="120" cy="170" r="100" fill="url(#glow)"/>

  <!-- Burger Group (with bite mask applied) -->
  <g mask="url(#biteMask)" filter="url(#burgerShadow)">
    
    <!-- Bottom Bun -->
    <path d="M 50,195 C 50,212 70,218 120,218 C 170,218 190,212 190,195 Z" fill="#d97706"/>
    <path d="M 52,197 C 52,208 70,213 120,213 C 170,213 188,208 188,197 Z" fill="#b45309"/>

    <!-- Lettuce Layer -->
    <path d="M 45,188 C 45,188 60,198 80,190 C 100,182 110,196 130,190 C 150,184 170,198 185,188 C 190,186 195,190 195,190 C 195,190 180,202 150,198 C 120,194 110,204 85,198 C 60,192 45,188 45,188 Z" fill="#22c55e"/>

    <!-- Burger Beef Patty -->
    <rect x="48" y="172" width="144" height="20" rx="8" fill="#451a03"/>
    <!-- Grill marks -->
    <line x1="70" y1="172" x2="80" y2="192" stroke="#270e02" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="172" x2="110" y2="192" stroke="#270e02" stroke-width="3" stroke-linecap="round"/>
    <line x1="130" y1="172" x2="140" y2="192" stroke="#270e02" stroke-width="3" stroke-linecap="round"/>
    <line x1="160" y1="172" x2="170" y2="192" stroke="#270e02" stroke-width="3" stroke-linecap="round"/>

    <!-- Cheese Melt Layer -->
    <path d="M 46,172 L 194,172 C 194,172 190,188 175,184 C 160,180 155,196 145,192 C 135,188 130,184 110,184 C 90,184 80,196 70,190 C 60,184 46,172 46,172 Z" fill="#fbbf24"/>

    <!-- Tomato Slice Layer -->
    <rect x="54" y="160" width="62" height="14" rx="5" fill="#ef4444"/>
    <rect x="124" y="160" width="62" height="14" rx="5" fill="#ef4444"/>

    <!-- Top Bun -->
    <path d="M 48,158 C 48,118 70,110 120,110 C 170,110 192,118 192,158 Z" fill="#f59e0b"/>
    <!-- Bun Highlight -->
    <path d="M 52,152 C 52,122 75,116 120,116 C 165,116 188,122 188,152" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.4"/>
    
    <!-- Sesame Seeds -->
    <ellipse cx="80" cy="130" rx="2" ry="4" fill="#ffffff" transform="rotate(30 80 130)"/>
    <ellipse cx="105" cy="124" rx="2" ry="4" fill="#ffffff" transform="rotate(-15 105 124)"/>
    <ellipse cx="135" cy="126" rx="2" ry="4" fill="#ffffff" transform="rotate(20 135 126)"/>
    <ellipse cx="160" cy="132" rx="2" ry="4" fill="#ffffff" transform="rotate(-40 160 132)"/>
    <ellipse cx="120" cy="136" rx="2" ry="4" fill="#ffffff" transform="rotate(10 120 136)"/>
  </g>
</svg>
