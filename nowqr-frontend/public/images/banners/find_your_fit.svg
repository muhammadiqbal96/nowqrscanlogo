<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="fashionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
    <filter id="tagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#57534e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#fashionBg)"/>

  <!-- Minimalist background hangers sketch -->
  <path d="M 40,-20 L 40,60 M 200,-20 L 200,60" stroke="#d6d3d1" stroke-width="2"/>
  <path d="M 30,60 L 210,60" stroke="#a8a29e" stroke-width="4" stroke-linecap="round"/>

  <!-- Tag Rope / Thread -->
  <path d="M 120,60 C 120,60 110,80 120,110" fill="none" stroke="#78716c" stroke-width="2" stroke-linecap="round"/>

  <!-- Luxury Hanging Clothing Tag (centered at 120, 195) -->
  <rect x="52" y="110" width="136" height="170" rx="16" fill="#ffffff" filter="url(#tagShadow)"/>
  <rect x="58" y="116" width="124" height="158" rx="12" fill="none" stroke="#d6d3d1" stroke-width="1.5"/>

  <!-- Rope Eyelet on Tag -->
  <circle cx="120" cy="126" r="6" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="2"/>

  <!-- Gold/Bronze Brand Detail Foil -->
  <rect x="90" y="142" width="60" height="2" fill="#d97706" opacity="0.6"/>

  <!-- Inner QR Holder Frame -->
  <rect x="62" y="150" width="116" height="116" rx="10" fill="none" stroke="#a8a29e" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
</svg>
