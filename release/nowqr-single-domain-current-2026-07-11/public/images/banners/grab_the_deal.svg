<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="dealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="bagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#470517" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#dealBg)"/>

  <!-- Geometric chic retail pattern backdrop -->
  <circle cx="240" cy="0" r="140" fill="#fecdd3" opacity="0.4"/>
  <circle cx="0" cy="340" r="100" fill="#fecdd3" opacity="0.3"/>

  <!-- Shopping Bag Handles -->
  <path d="M 90,120 Q 120,60 150,120" fill="none" stroke="url(#goldAccent)" stroke-width="6" stroke-linecap="round" filter="url(#bagShadow)"/>
  <path d="M 95,120 Q 120,68 145,120" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Shopping Bag Body (centered around 120, 195) -->
  <path d="M 50,115 L 190,115 C 195,115 198,120 196,125 L 180,265 C 179,270 174,274 169,274 L 71,274 C 66,274 61,270 60,265 L 44,125 C 42,120 45,115 50,115 Z" fill="url(#bagGrad)" filter="url(#bagShadow)"/>

  <!-- Bag Top Flap Highlight -->
  <line x1="50" y1="122" x2="190" y2="122" stroke="url(#goldAccent)" stroke-width="1.5"/>

  <!-- Inner Label Frame (where QR code sits) -->
  <rect x="58" y="132" width="124" height="124" rx="16" fill="none" stroke="url(#goldAccent)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
</svg>
