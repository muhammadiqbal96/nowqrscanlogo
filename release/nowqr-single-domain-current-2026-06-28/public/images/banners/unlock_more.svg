<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#cyberBg)"/>

  <!-- Tech grid pattern background lines -->
  <line x1="20" y1="0" x2="20" y2="340" stroke="#1e293b" stroke-width="1"/>
  <line x1="220" y1="0" x2="220" y2="340" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="50" x2="240" y2="50" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="290" x2="240" y2="290" stroke="#1e293b" stroke-width="1"/>

  <!-- Padlock Shackle (arch framing the top of the QR code) -->
  <path d="M 60,170 L 60,120 C 60,80 180,80 180,120 L 180,170" fill="none" stroke="url(#neonGrad)" stroke-width="10" stroke-linecap="round" filter="url(#neonGlow)"/>
  
  <!-- Outer glowing hexagon frame -->
  <polygon points="120,74 202,122 202,218 120,266 38,218 38,122" fill="none" stroke="#d946ef" stroke-width="2" opacity="0.4" filter="url(#neonGlow)"/>
  
  <!-- Inner circular ring lock -->
  <circle cx="120" cy="170" r="78" fill="none" stroke="#06b6d4" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Keyhole detail below the QR area -->
  <g transform="translate(120, 236)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="8" fill="#d946ef"/>
    <polygon points="-5,4 5,4 8,18 -8,18" fill="#d946ef"/>
  </g>
</svg>
