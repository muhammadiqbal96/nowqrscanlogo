<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="journeyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="neonSpark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#journeyBg)"/>

  <!-- Starry Sky (Subtle dots) -->
  <circle cx="40" cy="50" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="180" cy="60" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="80" cy="110" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="210" cy="120" r="1" fill="#ffffff" opacity="0.6"/>

  <!-- Perspective Highway Road lines leading to center -->
  <polygon points="120,170 100,340 140,340" fill="#312e81" opacity="0.3"/>
  <line x1="120" y1="170" x2="120" y2="340" stroke="#facc15" stroke-dasharray="10 10" stroke-width="2" opacity="0.5"/>

  <!-- Glowing steering wheel ring (frames QR) -->
  <circle cx="120" cy="170" r="82" fill="none" stroke="url(#glowGrad)" stroke-width="5" filter="url(#neonSpark)"/>
  <circle cx="120" cy="170" r="76" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>

  <!-- Steering Wheel Spokes -->
  <line x1="44" y1="170" x2="196" y2="170" stroke="url(#glowGrad)" stroke-width="4" opacity="0.8" filter="url(#neonSpark)"/>
  <line x1="120" y1="170" x2="120" y2="246" stroke="url(#glowGrad)" stroke-width="4" opacity="0.8" filter="url(#neonSpark)"/>
</svg>
