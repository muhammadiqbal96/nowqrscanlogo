<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#boxBg)"/>

  <!-- Magic Sparkles rising -->
  <path d="M 60,80 L 62,83 L 65,84 L 62,85 L 60,88 L 58,85 L 55,84 L 58,83 Z" fill="#eab308" opacity="0.6" filter="url(#boxGlow)"/>
  <path d="M 180,90 L 181,93 L 184,94 L 181,95 L 180,98 L 179,95 L 176,94 L 179,93 Z" fill="#eab308" opacity="0.6"/>

  <!-- Golden Ray Beam behind QR code -->
  <ellipse cx="120" cy="180" rx="60" ry="80" fill="#fef08a" opacity="0.1" filter="url(#boxGlow)"/>

  <!-- Open Gift Box Lid floating above -->
  <g transform="translate(120, 95) rotate(-12) translate(-120, -95)" filter="url(#boxGlow)">
    <rect x="70" y="85" width="100" height="15" rx="2" fill="#ef4444"/>
    <rect x="115" y="85" width="10" height="15" fill="url(#goldRibbon)"/>
  </g>

  <!-- Open Gift Box Body (centered at 120, 245) -->
  <g filter="url(#boxGlow)">
    <rect x="75" y="220" width="90" height="70" rx="4" fill="#dc2626"/>
    <!-- Gold Ribbon wraps -->
    <rect x="115" y="220" width="10" height="70" fill="url(#goldRibbon)"/>
    <!-- Box interior glow shadow -->
    <path d="M 75,220 Q 120,200 165,220 L 165,224 L 75,224 Z" fill="#eab308" opacity="0.8"/>
  </g>

  <!-- Circular Portal Frame framing QR -->
  <circle cx="120" cy="170" r="76" fill="none" stroke="url(#goldRibbon)" stroke-width="2" stroke-dasharray="12 8" opacity="0.5"/>
  <circle cx="120" cy="170" r="82" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.3"/>
</svg>
