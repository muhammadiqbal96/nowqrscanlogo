<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="compassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background (Sunrise Compass / Adventure backdrop) -->
  <rect width="240" height="340" rx="24" fill="url(#skyBg)"/>

  <!-- Minimalist Mountain Silhouettes at the bottom -->
  <path d="M 0,340 L 0,280 Q 40,250 80,290 T 160,260 T 240,300 L 240,340 Z" fill="#0369a1" opacity="0.3"/>
  <path d="M 0,340 L 0,300 Q 50,280 100,310 T 200,290 T 240,320 L 240,340 Z" fill="#0f172a" opacity="0.4"/>

  <!-- Compass Top Ring / Loop -->
  <circle cx="120" cy="74" r="16" fill="none" stroke="url(#brass)" stroke-width="6" filter="url(#compassShadow)"/>
  <rect x="116" y="80" width="8" height="12" fill="url(#brass)"/>

  <!-- Compass Outer Housing (centered at 120, 170) -->
  <circle cx="120" cy="170" r="82" fill="url(#brass)" filter="url(#compassShadow)"/>
  <circle cx="120" cy="170" r="76" fill="#0f172a"/>

  <!-- Compass Scale Markings -->
  <circle cx="120" cy="170" r="72" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="2 6"/>
  <circle cx="120" cy="170" r="68" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>

  <!-- Compass Cardinal Letters -->
  <text x="120" y="112" fill="#ffffff" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle" opacity="0.9">N</text>
  <text x="120" y="238" fill="#ffffff" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle" opacity="0.9">S</text>
  <text x="58" y="173" fill="#ffffff" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle" opacity="0.9">W</text>
  <text x="182" y="173" fill="#ffffff" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle" opacity="0.9">E</text>

  <!-- Compass Needle (Behind QR space) -->
  <polygon points="120,115 125,170 115,170" fill="#ef4444" opacity="0.9"/>
  <polygon points="120,225 125,170 115,170" fill="#94a3b8" opacity="0.9"/>

  <!-- Inner Rim Border framing the QR card -->
  <circle cx="120" cy="170" r="54" fill="none" stroke="url(#brass)" stroke-width="2" opacity="0.8"/>
</svg>
