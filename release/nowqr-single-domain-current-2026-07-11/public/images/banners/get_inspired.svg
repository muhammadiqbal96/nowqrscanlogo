<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="paletteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#7c2d12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#artBg)"/>

  <!-- Artistic paint splatters in background -->
  <path d="M 20,40 C 40,20 60,60 50,80 C 40,100 10,80 20,40 Z" fill="#3b82f6" opacity="0.1"/>
  <path d="M 200,280 C 220,260 230,300 220,320 C 210,340 180,320 200,280 Z" fill="#ef4444" opacity="0.1"/>

  <!-- Wooden Paint Palette (centered at 120, 170) -->
  <path d="M 50,170 C 50,110 90,80 150,80 C 200,80 210,130 190,180 C 170,230 190,260 140,260 C 90,260 50,230 50,170 Z" fill="url(#wood)" filter="url(#paletteShadow)"/>

  <!-- Thumb Hole in Palette -->
  <ellipse cx="85" cy="210" rx="10" ry="15" fill="#f5f5f4" transform="rotate(-30 85 210)"/>

  <!-- Blobs of Colorful Paint on Palette (framing the QR area) -->
  <circle cx="95" cy="115" r="14" fill="#ef4444"/>
  <circle cx="130" cy="100" r="13" fill="#eab308"/>
  <circle cx="165" cy="115" r="14" fill="#22c55e"/>
  <circle cx="185" cy="150" r="13" fill="#3b82f6"/>
  <circle cx="175" cy="195" r="14" fill="#a855f7"/>

  <!-- Circular Ring Inside Palette to frame QR -->
  <circle cx="130" cy="165" r="54" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
</svg>
