<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="vibeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="vinylGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <filter id="vinylShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#vibeBg)"/>

  <!-- Laser / concert light rays -->
  <line x1="0" y1="0" x2="100" y2="340" stroke="#a78bfa" stroke-width="4" opacity="0.3"/>
  <line x1="240" y1="0" x2="140" y2="340" stroke="#f472b6" stroke-width="4" opacity="0.3"/>

  <!-- Vinyl Record (centered at 120, 170) -->
  <circle cx="120" cy="170" r="90" fill="url(#vinylGrad)" filter="url(#vinylShadow)"/>

  <!-- Vinyl Grooves -->
  <circle cx="120" cy="170" r="82" fill="none" stroke="#3f3f46" stroke-width="1.5" opacity="0.6"/>
  <circle cx="120" cy="170" r="74" fill="none" stroke="#3f3f46" stroke-width="1.5" opacity="0.6"/>
  <circle cx="120" cy="170" r="66" fill="none" stroke="#3f3f46" stroke-width="1" opacity="0.5"/>
  <circle cx="120" cy="170" r="58" fill="none" stroke="#3f3f46" stroke-width="1" opacity="0.5"/>

  <!-- Record Center Label Ring (perfect border to seat the QR code) -->
  <circle cx="120" cy="170" r="52" fill="none" stroke="#ec4899" stroke-width="3" filter="url(#vinylShadow)"/>
  <circle cx="120" cy="170" r="48" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
</svg>
