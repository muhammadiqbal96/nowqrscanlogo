<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="vipBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31080d"/>
      <stop offset="100%" stop-color="#140204"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="rope" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="vipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#vipBg)"/>

  <!-- Spotlight Rays in Background -->
  <polygon points="120,0 40,340 200,340" fill="#fef08a" opacity="0.04"/>

  <!-- Red Carpet (Subtle diagonal red carpet shape) -->
  <polygon points="50,340 190,340 145,240 95,240" fill="#dc2626" opacity="0.2"/>

  <!-- VIP Gold Stanchion Posts (Left & Right) -->
  <g filter="url(#vipShadow)">
    <!-- Left Post -->
    <rect x="25" y="140" width="8" height="130" fill="url(#gold)"/>
    <ellipse cx="29" cy="140" rx="8" ry="6" fill="url(#gold)"/>
    <circle cx="29" cy="130" r="6" fill="url(#gold)"/>
    <ellipse cx="29" cy="270" rx="14" ry="6" fill="url(#gold)"/>
    <!-- Right Post -->
    <rect x="207" y="140" width="8" height="130" fill="url(#gold)"/>
    <ellipse cx="211" cy="140" rx="8" ry="6" fill="url(#gold)"/>
    <circle cx="211" cy="130" r="6" fill="url(#gold)"/>
    <ellipse cx="211" cy="270" rx="14" ry="6" fill="url(#gold)"/>
  </g>

  <!-- Hanging Red Velvet Rope (arched below the center QR area) -->
  <path d="M 33,142 Q 120,240 207,142" fill="none" stroke="url(#rope)" stroke-width="12" stroke-linecap="round" filter="url(#vipShadow)"/>
  <path d="M 33,142 Q 120,240 207,142" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Inner VIP circular rope ring in background to frame the QR code -->
  <circle cx="120" cy="170" r="82" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="10 5" opacity="0.3"/>
</svg>
