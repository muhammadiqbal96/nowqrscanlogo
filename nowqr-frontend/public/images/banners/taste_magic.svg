<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="magicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0f052d"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="340" rx="24" fill="url(#magicBg)"/>

  <!-- Magical Sparkles and stars -->
  <path d="M 50,60 L 52,65 L 57,67 L 52,69 L 50,74 L 48,69 L 43,67 L 48,65 Z" fill="#a78bfa" opacity="0.6" filter="url(#glow)"/>
  <path d="M 190,80 L 191,83 L 194,84 L 191,85 L 190,88 L 189,85 L 186,84 L 189,83 Z" fill="#f472b6" opacity="0.5"/>
  <circle cx="60" cy="120" r="3" fill="#60a5fa" opacity="0.4"/>
  <circle cx="180" cy="270" r="2.5" fill="#f472b6" opacity="0.4"/>

  <!-- Cooking Pot Cauldron -->
  <ellipse cx="120" cy="250" rx="65" ry="40" fill="url(#potGrad)"/>
  <rect x="50" y="220" width="140" height="12" rx="6" fill="#4b5563"/>
  
  <!-- Pot Handles -->
  <path d="M 50,230 C 30,230 30,250 50,250" fill="none" stroke="#4b5563" stroke-width="6"/>
  <path d="M 190,230 C 210,230 210,250 190,250" fill="none" stroke="#4b5563" stroke-width="6"/>

  <!-- Magical Glowing Steam forming a circular frame for QR -->
  <circle cx="120" cy="170" r="82" fill="none" stroke="#a78bfa" stroke-width="4" stroke-dasharray="10 15" opacity="0.3" filter="url(#glow)"/>
  <circle cx="120" cy="170" r="76" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.4"/>

  <!-- Steam wisps rising out of pot framing center -->
  <path d="M 70,220 C 50,180 80,140 100,120" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>
  <path d="M 170,220 C 190,180 160,140 140,120" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>
</svg>
